name: Build Android OSS APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    defaults:
      run:
        working-directory: apps/android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build OSS debug APK
        env:
          OAUTH_CLIENT_ID: ${{ vars.OAUTH_CLIENT_ID }}
        run: |
          if [ -z "$OAUTH_CLIENT_ID" ]; then
            echo "::error::请先配置 Repository variable: OAUTH_CLIENT_ID"
            exit 1
          fi
          chmod +x gradlew
          ./gradlew :app:assembleOssDebug \
            "-POAUTH_CLIENT_ID=$OAUTH_CLIENT_ID" \
            --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: orange-cloud-oss-debug
          path: apps/android/app/build/outputs/apk/oss/debug/*.apk
          if-no-files-found: error
          retention-days: 14
